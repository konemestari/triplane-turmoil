name: iOS build

# Builds an unsigned Triplane.ipa. Sign and install it with Sideloadly
# (free Apple ID) or any other re-signing tool.

on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDL2 and SDL2_mixer sources
        run: |
          git clone --depth 1 --branch release-2.32.8 https://github.com/libsdl-org/SDL deps/SDL
          git clone --depth 1 --branch release-2.8.2 https://github.com/libsdl-org/SDL_mixer deps/SDL_mixer
          cd deps/SDL_mixer
          git submodule update --init --depth 1 external/libxmp

      - name: Build game data (fokker.dks)
        run: |
          c++ -o dksbuild src/tools/dksbuild/dksbuild.cc
          ./dksbuild data/fokker.lst
          ls -la fokker.dks

      - name: Configure (Xcode, iOS)
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

      - name: Build
        run: |
          cmake --build build --config Release --target triplane -- \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned .ipa
        run: |
          APP=$(find build -name "Triplane.app" -type d | head -1)
          echo "App bundle: $APP"
          ls -la "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Triplane.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Triplane-ipa
          path: Triplane.ipa
